[package]
name = "codeshield"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
anyhow = "1.0.102"
thiserror = "1.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "sqlite", "migrate", "chrono", "uuid"] }
reqwest = { version = "0.13.4", features = ["json", "stream"] }
uuid = { version = "1.23.3", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
sha2 = "0.11.0"
hex = "0.4.3"
walkdir = "2.5.0"
tree-sitter = "0.22"
clap = { version = "4.6.1", features = ["derive"] }
indicatif = "0.18.4"
colored = "3.1.1"
shellexpand = "3.1.2"
pcap = "2.2.0"